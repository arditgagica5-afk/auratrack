<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#08080A" />
  <title>AuraTrack // Music &amp; Film Radar</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col selection:bg-white selection:text-black">
  <div id="err-bar" class="hidden bg-red-600 text-white text-xs p-2 text-center mono"></div>
  <div id="hdr"></div>
  <main id="app" class="max-w-xl w-full mx-auto px-4 py-5 flex-1 flex flex-col"></main>
  <div id="modals"></div>
  <script>window.onerror = function(m){ var b=document.getElementById('err-bar'); b.classList.remove('hidden'); b.textContent='ERR: '+m; };</script>
  <script src="ui1.js"></script>
  <script src="ui2.js"></script>
  <script src="ui3.js"></script>
  <script src="vault.js"></script>
  <script src="movies.js"></script>
  <script src="radar.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
